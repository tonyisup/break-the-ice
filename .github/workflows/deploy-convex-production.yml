name: Deploy Convex production

# Merges to main that change the backend deploy it to production, but only
# after the owner approves the protected `convex-production` environment.
# The runbook is "Production deploys" in README.md.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-convex-production.yml"
      - "convex/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. Never cancel one that is running.
concurrency:
  group: break-the-ice-convex-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source (no secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GitHub creates a missing environment with no protection the first time
      # a job uses it, which would deploy without approval. Refuse unless the
      # environment already requires a reviewer and limits deploy branches.
      - name: Require owner approval on the production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/convex-production") || {
            echo "::error::Create the convex-production environment before production can deploy (see Production deploys in README.md)."
            exit 1
          }
          reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$environment")
          branches=$(jq -r 'if .deployment_branch_policy == null then "any" else "restricted" end' <<<"$environment")
          if [ "$reviewers" -lt 1 ] || [ "$branches" != "restricted" ]; then
            echo "::error::convex-production must require a reviewer and limit deployment branches before production can deploy (see Production deploys in README.md)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint still has pre-existing errors, so it is not part of the gate yet.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test:run

  deploy:
    name: Deploy to production (approval required)
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: convex-production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
    steps:
      # A dev or preview key would deploy somewhere else and still look green.
      - name: Require a production deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Set the CONVEX_PRODUCTION_DEPLOY_KEY secret on the convex-production environment (see Production deploys in README.md)."
            exit 1
          fi
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *)
              echo "::error::CONVEX_PRODUCTION_DEPLOY_KEY is not a production deploy key."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy backend
        run: >-
          npx convex deploy
          --typecheck enable
          --message "GitHub production ${GITHUB_SHA}"
